<section class="hero" [class.hero--ready]="heroImageLoaded()" id="topo" aria-label="Casamento Ana e Kaio">
  @if (!heroImageLoaded()) {
    <div class="hero__loader" aria-live="polite">
      <span></span>
      <p>Carregando</p>
    </div>
  }

  <img
    class="hero__photo-backdrop"
    src="/fotos-site/capa-principal.jpeg"
    width="591"
    height="886"
    style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(14px); opacity: 0.62; transform: scale(1.08);"
    alt=""
    aria-hidden="true"
  />
  <img
    class="hero__photo"
    src="/fotos-site/capa-principal.jpeg"
    width="591"
    height="886"
    style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: center 46%;"
    alt="Kaio e Ana"
    (load)="showHero()"
  />
  <div class="hero__content">
    <h1>{{ coupleName }}</h1>
    <p>O cordão de três dobras não se quebra tão depressa.</p>
    <span>ECLESIASTES 4:12</span>
  </div>
</section>
