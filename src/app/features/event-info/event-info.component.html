<section class="section event-info" id="informacoes">
  <div>
    <p class="eyebrow">Informações</p>
    <h2>Local, horário e detalhes</h2>
  </div>
  <div class="info-grid">
    @for (card of eventCards; track card.label) {
      <article>
        <span>{{ card.label }}</span>
        <strong>{{ card.title }}</strong>
        <p>{{ card.description }}</p>
      </article>
    }
  </div>
</section>
